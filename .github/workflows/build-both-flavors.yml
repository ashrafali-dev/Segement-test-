name: Build both flavors (debug APKs)

# Two products now exist (see app/build.gradle: `full` and `manualLite`), and `assembleRelease`
# alone produces one APK per flavor, so its output path is no longer unique. This workflow builds
# the debug APKs for both flavors and uploads them as artifacts, which needs no signing secrets.
#
# It is deliberately separate from build.yml: that one publishes the signed release for main and
# is gated on the permanent keystore, while this one is for reviewing a branch or PR.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - fix/lens-ocr-model-routing-manual-extract-20261024
  push:
    branches:
      - fix/rt-ocr-latency-20261026

permissions:
  contents: read

jobs:
  build-debug-apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble full and manualLite debug APKs
        run: gradle assembleFullDebug assembleManualLiteDebug --no-daemon --stacktrace

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelStudio-full-debug-APK
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload manualLite APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelStudio-manualLite-debug-APK
          path: app/build/outputs/apk/manualLite/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report APK sizes
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/*/debug/*.apk; do
            printf '%-60s %s\n' "$apk" "$(du -h "$apk" | cut -f1)"
          done

      - name: Confirm the lite APK ships no ONNX runtime
        run: |
          set -euo pipefail
          LITE="$(find app/build/outputs/apk/manualLite/debug -name '*.apk' | head -n 1)"
          test -n "$LITE"
          if unzip -l "$LITE" | grep -q 'libonnxruntime'; then
            echo "::error::manualLite APK contains libonnxruntime — the low-RAM promise is broken."
            unzip -l "$LITE" | grep 'libonnxruntime' || true
            exit 1
          fi
          echo "PASS: manualLite APK contains no libonnxruntime shared library."
