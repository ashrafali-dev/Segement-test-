name: Validate OCR feature branch

on:
  push:
    branches:
      - fix/lens-ocr-model-routing-manual-extract-20261024
      - fix/canvas-page-overlay-lifecycle-20261025
      - fix/all-modes-markers-masking-20261026
      - fix/security-hardening-20261028
      - fix/hybrid-text-cleanup-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Test embedded WebView overlay layout
        run: node scripts/test-webmode-overlay-layout.js
      - name: Configure the existing release signing key required by app/build.gradle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable GitHub Secret is missing; Gradle cannot evaluate app/build.gradle without the configured release signing key."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/novelstudio-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Release key validated."
      - name: Run unit tests and debug build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/novelstudio-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleDebug assembleRelease --no-daemon
      - name: Verify permanent release signing certificate
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          SIGNATURE_REPORT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNATURE_REPORT"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$SIGNATURE_REPORT" | awk '/certificate SHA-256 digest:/ {print tolower($NF); exit}')"
          EXPECTED_CERT_SHA256="3e783739eb6e9aadf8bd9f5b23f8fb99a65c4cfabdcb8ec8fb09c2921dcbb44b"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Release signing certificate does not match the established Novel Studio certificate."
            echo "::error::Expected $EXPECTED_CERT_SHA256; got ${ACTUAL_CERT_SHA256:-missing}"
            exit 1
          fi
          echo "PASS: APK uses the established Novel Studio release certificate."
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelStudio-SIGNED-RELEASE-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelStudio-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
