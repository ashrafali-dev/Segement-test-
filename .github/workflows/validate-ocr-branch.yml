name: Validate OCR feature branch

on:
  push:
    branches:
      - fix/lens-ocr-model-routing-manual-extract-20261024
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Run unit tests and debug build
        run: gradle testDebugUnitTest assembleDebug --no-daemon
