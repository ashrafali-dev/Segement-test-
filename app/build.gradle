plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKeystore = System.getenv("KEYSTORE_FILE")
def releaseStorePassword = System.getenv("KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("KEY_ALIAS")
def releaseKeyPassword = System.getenv("KEY_PASSWORD")

android {
    namespace 'com.ashraf.novelstudio'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ashraf.novelstudio'
        minSdk 24
        targetSdk 33
        versionCode 71
versionName '1.7.1'

        // Build one ARM APK compatible with both 32-bit and 64-bit ARM devices.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // Two products:
    //   full       - the existing realtime app (ONNX Runtime + LaMa aiPainter + ONNX bubble detector).
    //   manualLite - low-RAM build: NO ONNX Runtime at all, so neither the 37 MB LaMa inpainter nor the
    //                bubble detector can ever load into the ~192 MB heap. Manual extract uses the built-in
    //                BubbleFit mask instead. Stub classes live in src/manualLite/.
    // The dependency is declared per-flavour so manualLite does not ship libonnxruntime*.so.
    flavorDimensions += 'build'
    productFlavors {
        full {
            dimension 'build'
            buildConfigField 'boolean', 'MANUAL_LITE', 'false'
        }
        manualLite {
            dimension 'build'
            applicationIdSuffix '.lite'
            versionNameSuffix '-lite'
            buildConfigField 'boolean', 'MANUAL_LITE', 'true'
        }
    }

    signingConfigs {
        release {
            if (releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            } else {
                // Debug builds must still configure: throwing here (as this used to) fails `assemble*Debug`
                // with "Release signing is not configured" before a single task runs. Fail only when a
                // release APK is actually requested, and fail it clearly.
                tasks.configureEach { task ->
                    def n = task.name.toLowerCase()
                    if (n.startsWith('assemble') && n.contains('release') || n.startsWith('bundle') && n.contains('release')) {
                        task.doFirst {
                            throw new GradleException("Release signing is not configured. Add KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD.")
                        }
                    }
                }
            }
            minifyEnabled false
        }
    }

    buildFeatures {
        // Needed for BuildConfig.MANUAL_LITE (manualLite vs full).
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', 'src/assets']
            // The two ONNX-backed engines live in their own flavour source sets (src/full = the real ones,
            // src/manualLite = no-op stubs). Compiling both would clash, and a flavour's exclude cannot
            // reach files held in main, so they are moved out of main instead.
            java.exclude 'com/ashraf/novelstudio/WebModeInpainter.kt'
            java.exclude 'com/ashraf/novelstudio/BubbleDetector.kt'
        }
        // manualLite replaces the two engines with stubs: no ONNX Runtime at all in that APK.
        manualLite { java.srcDirs += 'src/manualLite/java' }
        full { java.srcDirs += 'src/full/java' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.browser:browser:1.8.0'

    // Web Mode OCR: on-device ML Kit, one bundled model per script (Latin / Chinese / Japanese / Korean).
    // OCR models live in Google Play Services and are SHARED with every other app on the phone (Translate, Lens ...):
    // nothing is bundled in this APK, nothing is loaded into this app's own memory. Same classes, same code.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.1'

    // ONNX Runtime: runs the optional speech-bubble/text detector (BubbleDetector) and the optional LaMa inpainter.
    // OCR itself is ML Kit (above) or Google Lens; there is no downloadable OCR engine any more.
    // Scoped to the full flavour only: manualLite ships no libonnxruntime*.so, so neither model can load
    // into a low-RAM phone's heap (that is the whole point of the lite build).
    fullImplementation 'com.microsoft.onnxruntime:onnxruntime-android:1.21.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
}
