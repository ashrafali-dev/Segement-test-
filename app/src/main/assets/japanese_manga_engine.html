<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NovelStudio Japanese Manga OCR</title>
<style>html,body{margin:0;background:#10131c;color:#d9deeb;font:14px sans-serif}#state{padding:8px}</style>
<script src="https://appassets.androidplatform.net/manga-engine/ort.wasm.min.js"></script>
</head>
<body><div id="state">Initializing optional manga OCR runtime…</div>
<script>
(function () {
  'use strict';
  const BASE = 'https://appassets.androidplatform.net/manga-engine/';
  let detector = null, recognizer = null, dictionary = null, busy = false, readySignalled = false;
  const state = document.getElementById('state');
  function bridge(name, id, message) {
    try {
      const b = window.NsJapaneseMangaBridge;
      if (b && typeof b[name] === 'function') {
        if (message === undefined) b[name](String(id || ''));
        else b[name](String(id || ''), String(message));
      }
    } catch (_) {}
  }

  async function loadModels() {
    if (!window.ort) throw new Error('ONNX Runtime WASM could not load');
    ort.env.wasm.wasmPaths = {
      mjs: BASE + 'ort-wasm-simd-threaded.mjs',
      wasm: BASE + 'ort-wasm-simd-threaded.wasm'
    };
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.proxy = false;
    if (!detector) detector = await ort.InferenceSession.create(BASE + 'det/manga_det_v0.2.onnx', { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
    if (!recognizer) recognizer = await ort.InferenceSession.create(BASE + 'rec/manga_rec_v0.2.onnx', { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
    if (!dictionary) {
      const response = await fetch(BASE + 'ppocrv6_dict.txt');
      if (!response.ok) throw new Error('Character dictionary unavailable (' + response.status + ')');
      const rows = (await response.text()).replace(/^\uFEFF/, '').split(/\r?\n/);
      while (rows.length && rows[rows.length - 1] === '') rows.pop();
      dictionary = [''];
      for (const row of rows) dictionary.push(row.replace(/\r$/, ''));
      dictionary.push(' ');
      if (dictionary.length < 10000) throw new Error('Character dictionary is incomplete');
    }
    state.textContent = 'Japanese manga OCR ready';
    if (!readySignalled) {
      readySignalled = true;
      try { if (window.NsJapaneseMangaBridge) window.NsJapaneseMangaBridge.onReady(); } catch (_) {}
    }
  }

  function canvasOf(width, height) {
    const c = document.createElement('canvas'); c.width = width; c.height = height; return c;
  }
  function toArgb(r,g,b) {
    return (0xFF000000 | (Math.round(r)<<16) | (Math.round(g)<<8) | Math.round(b)) | 0;
  }

  // Sample the pixels immediately around the detected lettering. Bubble pages are usually
  // black ink on white paper; sampled colour helps the overlay cover the original glyphs.
  function sampleColors(image, box) {
    const iw=image.naturalWidth, ih=image.naturalHeight;
    const pad=Math.max(3,Math.min(14,Math.round(Math.min(box.w,box.h)*0.16)));
    const x0=Math.max(0,Math.floor(box.x)-pad), y0=Math.max(0,Math.floor(box.y)-pad);
    const x1=Math.min(iw,Math.ceil(box.x+box.w)+pad), y1=Math.min(ih,Math.ceil(box.y+box.h)+pad);
    const cw=Math.max(1,x1-x0), ch=Math.max(1,y1-y0);
    const canvas=canvasOf(cw,ch),ctx=canvas.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(image,x0,y0,cw,ch,0,0,cw,ch);
    const pixels=ctx.getImageData(0,0,cw,ch).data;
    const left=Math.max(0,Math.min(cw-1,Math.floor(box.x)-x0));
    const top=Math.max(0,Math.min(ch-1,Math.floor(box.y)-y0));
    const right=Math.max(left,Math.min(cw-1,Math.ceil(box.x+box.w)-x0));
    const bottom=Math.max(top,Math.min(ch-1,Math.ceil(box.y+box.h)-y0));
    const border=[];
    function addBorder(x,y) {
      x=Math.round(x);y=Math.round(y);
      if(x<0||y<0||x>=cw||y>=ch)return;
      const at=(y*cw+x)*4;
      border.push([pixels[at],pixels[at+1],pixels[at+2]]);
    }
    for(let k=0;k<=6;k++){
      const fx=k/6;
      addBorder(left+(right-left)*fx,top-pad/2);
      addBorder(left+(right-left)*fx,bottom+pad/2);
      addBorder(left-pad/2,top+(bottom-top)*fx);
      addBorder(right+pad/2,top+(bottom-top)*fx);
    }
    function medianChannel(at) {
      if(!border.length)return 255;
      const values=border.map(p=>p[at]).sort((a,b)=>a-b);
      return values[Math.floor(values.length/2)];
    }
    const br=medianChannel(0), bgc=medianChannel(1), bb=medianChannel(2);
    const luma=0.2126*br+0.7152*bgc+0.0722*bb;
    const chroma=Math.max(br,bgc,bb)-Math.min(br,bgc,bb);
    const dark=[];
    const strideX=Math.max(1,Math.floor((right-left)/18));
    const strideY=Math.max(1,Math.floor((bottom-top)/18));
    for(let y=top;y<=bottom;y+=strideY)for(let x=left;x<=right;x+=strideX){
      const at=(y*cw+x)*4,r=pixels[at],g=pixels[at+1],b=pixels[at+2];
      const lum=0.2126*r+0.7152*g+0.0722*b;
      if(lum<Math.max(80,luma*0.58))dark.push([r,g,b]);
    }
    let fr=20,fg=20,fb=20;
    if(dark.length){
      fr=dark.reduce((a,p)=>a+p[0],0)/dark.length;
      fg=dark.reduce((a,p)=>a+p[1],0)/dark.length;
      fb=dark.reduce((a,p)=>a+p[2],0)/dark.length;
    }
    return {bg:toArgb(br,bgc,bb),fg:toArgb(fr,fg,fb),soft:(luma<150||chroma>38)};
  }

  // ---------------------------------------------------------------------------------------------
  // Detection tuning. Plain constants so they can be adjusted after testing on real pages.
  // ---------------------------------------------------------------------------------------------
  const TILE = 1024;          // source pixels per detection tile (long side)
  const TILE_OVERLAP = 176;   // shared pixels between neighbouring tiles
  const DET_LONG = 1280;      // detector input long side per tile (tiles are enlarged to about this)
  const MAX_TILES = 9;
  const BIN_THRESH = 0.25;    // probability-map binarisation
  const BOX_SCORE = 0.35;     // minimum mean probability of a component
  const UNCLIP = 1.3;         // DB unclip ratio (rectangle approximation)
  const BUDGET_MS = 110000;   // stop recognising after this long and return what we have

  // <geom>
  // Pure geometry: no DOM, no ONNX. Unit-tested outside the browser.
  const GEOM = (function () {
    function orient(b) {
      const r = b.h / Math.max(1, b.w);
      return r > 1.3 ? 'v' : (r < 1 / 1.3 ? 'h' : 'u');
    }
    function overlap1(a0, a1, b0, b1) { return Math.max(0, Math.min(a1, b1) - Math.max(a0, b0)); }
    function gap1(a0, a1, b0, b1) { return Math.max(0, Math.max(a0, b0) - Math.min(a1, b1)); }
    function union(a, b) {
      const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
      const r = Math.max(a.x + a.w, b.x + b.w), bt = Math.max(a.y + a.h, b.y + b.h);
      const wa = a.w * a.h, wb = b.w * b.h;
      return { x, y, w: r - x, h: bt - y, score: ((a.score || 0) * wa + (b.score || 0) * wb) / Math.max(1, wa + wb) };
    }

    // Joins fragments of ONE line (a column of a vertical bubble or a row of a horizontal one) and
    // duplicates from overlapping tiles. It never joins across the line direction, so neighbouring
    // vertical columns stay separate lines and are recognised one by one.
    function mergeFragments(input) {
      const boxes = input.map(b => Object.assign({}, b));
      let changed = true, passes = 0;
      while (changed && passes++ < 60) {
        changed = false;
        for (let i = 0; i < boxes.length; i++) {
          for (let j = i + 1; j < boxes.length;) {
            const a = boxes[i], b = boxes[j];
            const ox = overlap1(a.x, a.x + a.w, b.x, b.x + b.w), oy = overlap1(a.y, a.y + a.h, b.y, b.y + b.h);
            const inter = ox * oy, minArea = Math.max(1, Math.min(a.w * a.h, b.w * b.h));
            let join = inter / minArea >= 0.55;          // same text seen twice (tile overlap) or nested
            if (!join) {
              const oa = orient(a), ob = orient(b);
              if (oa !== 'h' && ob !== 'h' && (oa === 'v' || ob === 'v' || (oa === 'u' && ob === 'u'))) {
                const f = Math.max(a.w, b.w);
                if (ox >= 0.6 * Math.min(a.w, b.w) && gap1(a.y, a.y + a.h, b.y, b.y + b.h) <= 0.9 * f) join = true;
              }
              if (!join && oa !== 'v' && ob !== 'v') {
                const f = Math.max(a.h, b.h);
                if (oy >= 0.6 * Math.min(a.h, b.h) && gap1(a.x, a.x + a.w, b.x, b.x + b.w) <= 0.9 * f) join = true;
              }
            }
            if (!join) { j++; continue; }
            boxes[i] = union(a, b); boxes.splice(j, 1); changed = true;
          }
        }
      }
      return boxes;
    }

    // 'u' (roughly square) lines take the direction of their nearest clear neighbour, else the page's.
    function resolveOrientation(boxes) {
      const kinds = boxes.map(orient);
      let v = 0, h = 0;
      kinds.forEach(k => { if (k === 'v') v++; else if (k === 'h') h++; });
      return boxes.map((b, i) => {
        if (kinds[i] !== 'u') return kinds[i] === 'v';
        let best = null, bd = Infinity;
        const f = Math.max(b.w, b.h);
        boxes.forEach((o, j) => {
          if (j === i || kinds[j] === 'u') return;
          const d = Math.hypot((o.x + o.w / 2) - (b.x + b.w / 2), (o.y + o.h / 2) - (b.y + b.h / 2));
          if (d < bd && d < f * 4 + Math.max(o.w, o.h)) { bd = d; best = kinds[j]; }
        });
        if (best) return best === 'v';
        return v > h;
      });
    }

    function lineFont(l) { return Math.max(3, l.vertical ? l.w : l.h); }

    function joinText(parts) {
      let out = '';
      for (const p of parts) {
        if (!p) continue;
        if (out) {
          const a = out[out.length - 1], c = p[0];
          const ascii = ch => /[A-Za-z0-9]/.test(ch);
          out += (ascii(a) && ascii(c)) || (/[,.!?;:]/.test(a) && ascii(c)) ? ' ' : '';
        }
        out += p;
      }
      return out;
    }

    // Lines -> bubbles. A vertical bubble is a set of neighbouring columns; a horizontal one a stack of rows.
    function groupLines(lines) {
      const n = lines.length, parent = lines.map((_, i) => i);
      const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
      for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
        const a = lines[i], b = lines[j];
        if (a.vertical !== b.vertical) continue;
        const fa = lineFont(a), fb = lineFont(b), ratio = fa / fb;
        if (ratio < 0.55 || ratio > 1.8) continue;
        const f = Math.max(fa, fb);
        if (a.vertical) {
          const oy = overlap1(a.y, a.y + a.h, b.y, b.y + b.h);
          if (oy >= 0.3 * Math.min(a.h, b.h) && gap1(a.x, a.x + a.w, b.x, b.x + b.w) <= 1.1 * f) parent[find(j)] = find(i);
        } else {
          const ox = overlap1(a.x, a.x + a.w, b.x, b.x + b.w);
          if (ox >= 0.3 * Math.min(a.w, b.w) && gap1(a.y, a.y + a.h, b.y, b.y + b.h) <= 0.9 * f) parent[find(j)] = find(i);
        }
      }
      const groups = new Map();
      lines.forEach((l, i) => { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(l); });
      const blocks = [];
      for (const members of groups.values()) {
        const vert = members.filter(m => m.vertical).reduce((s, m) => s + m.text.length, 0) >=
                     members.filter(m => !m.vertical).reduce((s, m) => s + m.text.length, 0);
        const ordered = members.slice().sort(vert ? ((p, q) => (q.x + q.w / 2) - (p.x + p.w / 2)) : ((p, q) => (p.y + p.h / 2) - (q.y + q.h / 2)));
        let x = Infinity, y = Infinity, r = -Infinity, b = -Infinity, score = 0;
        ordered.forEach(m => { x = Math.min(x, m.x); y = Math.min(y, m.y); r = Math.max(r, m.x + m.w); b = Math.max(b, m.y + m.h); score += (m.conf || 0); });
        const fonts = ordered.map(lineFont).sort((p, q) => p - q);
        blocks.push({
          text: joinText(ordered.map(m => m.text)),
          x, y, w: r - x, h: b - y, vertical: vert, font: fonts[fonts.length >> 1],
          lines: ordered.length, conf: score / ordered.length
        });
      }
      return blocks;
    }

    // Japanese reading order: vertical pages go right to left, then top to bottom.
    function sortBlocks(blocks) {
      const vertical = blocks.filter(r => r.vertical).length > blocks.length * 0.45;
      blocks.sort((a, b) => {
        if (vertical) { const dx = (b.x + b.w / 2) - (a.x + a.w / 2); return Math.abs(dx) > Math.max(a.w, b.w) * 0.55 ? dx : a.y - b.y; }
        const dy = (a.y + a.h / 2) - (b.y + b.h / 2); return Math.abs(dy) > Math.max(a.h, b.h) * 0.7 ? dy : (b.x - a.x);
      });
      return vertical;
    }

    function tilePlan(W, H) {
      let tile = TILE;
      const starts = (len, t) => {
        if (len <= t * 1.15) return [[0, len]];
        const step = t - TILE_OVERLAP, out = [];
        for (let s = 0; ; s += step) {
          if (s + t >= len) { out.push([Math.max(0, len - t), len]); break; }
          out.push([s, s + t]);
        }
        return out;
      };
      let xs = starts(W, tile), ys = starts(H, tile);
      while (xs.length * ys.length > MAX_TILES && tile < 4096) { tile = Math.round(tile * 1.25); xs = starts(W, tile); ys = starts(H, tile); }
      const tiles = [];
      for (const [y0, y1] of ys) for (const [x0, x1] of xs) tiles.push({ x0, y0, w: x1 - x0, h: y1 - y0 });
      return tiles;
    }
    return { orient, mergeFragments, resolveOrientation, groupLines, sortBlocks, tilePlan, joinText };
  })();
  // </geom>

  function tileInput(image, t) {
    const u = Math.max(0.6, Math.min(2, DET_LONG / Math.max(t.w, t.h)));
    const rw = Math.max(32, Math.round(t.w * u / 32) * 32), rh = Math.max(32, Math.round(t.h * u / 32) * 32);
    const canvas = canvasOf(rw, rh);
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(image, t.x0, t.y0, t.w, t.h, 0, 0, rw, rh);
    const rgba = ctx.getImageData(0, 0, rw, rh).data;
    const plane = rw * rh, data = new Float32Array(3 * plane);
    // The model's reference path reads BGR pixels and applies these per-channel statistics.
    const mean = [0.485, 0.456, 0.406], std = [0.229, 0.224, 0.225];
    for (let i = 0, p = 0; i < rgba.length; i += 4, p++) {
      data[p] = (rgba[i + 2] / 255 - mean[0]) / std[0];
      data[plane + p] = (rgba[i + 1] / 255 - mean[1]) / std[1];
      data[2 * plane + p] = (rgba[i] / 255 - mean[2]) / std[2];
    }
    return { tensor: new ort.Tensor('float32', data, [1, 3, rh, rw]), rw, rh };
  }

  // Connected components of the probability map -> padded rectangles in SOURCE pixels.
  function components(map, mh, mw, t) {
    const visited = new Uint8Array(mh * mw), boxes = [];
    const sx = t.w / mw, sy = t.h / mh;
    for (let start = 0; start < map.length && boxes.length < 3000; start++) {
      if (visited[start] || map[start] <= BIN_THRESH) continue;
      const stack = [start]; visited[start] = 1;
      let minX = mw, minY = mh, maxX = -1, maxY = -1, sum = 0, count = 0;
      while (stack.length) {
        const at = stack.pop(), y = (at / mw) | 0, x = at - y * mw;
        if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
        sum += map[at]; count++;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= mw || ny >= mh) continue;
          const ni = ny * mw + nx;
          if (!visited[ni] && map[ni] > BIN_THRESH) { visited[ni] = 1; stack.push(ni); }
        }
      }
      const bw = maxX - minX + 1, bh = maxY - minY + 1;
      if (count < 4 || bw < 2 || bh < 2 || sum / count < BOX_SCORE) continue;
      // DB unclip, rectangle form: distance = area * ratio / perimeter, measured in map pixels.
      const d = (bw * bh * UNCLIP) / (2 * (bw + bh));
      const x0 = Math.max(0, minX - d), y0 = Math.max(0, minY - d), x1 = Math.min(mw, maxX + 1 + d), y1 = Math.min(mh, maxY + 1 + d);
      boxes.push({ x: t.x0 + x0 * sx, y: t.y0 + y0 * sy, w: (x1 - x0) * sx, h: (y1 - y0) * sy, score: sum / count });
    }
    return boxes;
  }

  async function detect(image) {
    const W = image.naturalWidth, H = image.naturalHeight, all = [];
    for (const t of GEOM.tilePlan(W, H)) {
      const input = tileInput(image, t);
      const out = await detector.run({ [detector.inputNames[0]]: input.tensor });
      const tensor = out[detector.outputNames[0]], dims = tensor.dims, data = tensor.data;
      const mh = dims[dims.length - 2], mw = dims[dims.length - 1];
      if (!mh || !mw || data.length < mh * mw) throw new Error('Unexpected detector output ' + JSON.stringify(dims));
      for (const b of components(data, mh, mw, t)) all.push(b);
    }
    return GEOM.mergeFragments(all)
      .map(b => { const x = Math.max(0, b.x), y = Math.max(0, b.y); return { x, y, w: Math.min(W - x, b.w), h: Math.min(H - y, b.h), score: b.score }; })
      .filter(b => b.w >= 4 && b.h >= 4)
      .sort((a, b) => b.score - a.score).slice(0, 300);
  }

  function stepConf(values, offset, vocab, bestValue, probs) {
    if (probs) return bestValue;
    let denom = 0;
    for (let k = 0; k < vocab; k++) denom += Math.exp(values[offset + k] - bestValue);
    return 1 / denom;
  }

  // Reads ONE line. Vertical lines are turned a quarter turn so the model sees them left-to-right.
  async function readLine(image, box, vertical) {
    const font = Math.max(3, vertical ? box.w : box.h), pad = Math.round(Math.max(2, font * 0.18));
    const x = Math.max(0, Math.floor(box.x - pad)), y = Math.max(0, Math.floor(box.y - pad));
    const w = Math.min(image.naturalWidth - x, Math.ceil(box.w + 2 * pad)), h = Math.min(image.naturalHeight - y, Math.ceil(box.h + 2 * pad));
    if (w < 2 || h < 2) return { text: '', conf: 0 };
    let crop = canvasOf(w, h);
    const cctx = crop.getContext('2d'); cctx.fillStyle = '#fff'; cctx.fillRect(0, 0, w, h);
    cctx.drawImage(image, x, y, w, h, 0, 0, w, h);
    if (vertical) {
      const rotated = canvasOf(h, w), ctx = rotated.getContext('2d');
      ctx.translate(0, rotated.height); ctx.rotate(-Math.PI / 2); ctx.drawImage(crop, 0, 0); crop = rotated;
    }
    const naturalW = Math.round(48 * crop.width / Math.max(1, crop.height));
    const tw = Math.max(16, Math.min(naturalW > 2000 ? 2400 : 640, naturalW));
    const small = canvasOf(tw, 48), ctx = small.getContext('2d', { willReadFrequently: true });
    ctx.imageSmoothingQuality = 'high'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, tw, 48); ctx.drawImage(crop, 0, 0, tw, 48);
    const rgba = ctx.getImageData(0, 0, tw, 48).data, plane = tw * 48, arr = new Float32Array(3 * plane);
    for (let i = 0, p = 0; i < rgba.length; i += 4, p++) {
      arr[p] = rgba[i + 2] / 127.5 - 1; arr[plane + p] = rgba[i + 1] / 127.5 - 1; arr[2 * plane + p] = rgba[i] / 127.5 - 1;
    }
    const out = await recognizer.run({ [recognizer.inputNames[0]]: new ort.Tensor('float32', arr, [1, 3, 48, tw]) });
    const tensor = out[recognizer.outputNames[0]], dims = tensor.dims;
    if (dims.length < 3) throw new Error('Unexpected recognizer output ' + JSON.stringify(dims));
    const steps = dims[dims.length - 2], vocab = dims[dims.length - 1], values = tensor.data;
    let s0 = 0, min0 = Infinity;
    for (let k = 0; k < vocab; k++) { const v = values[k]; s0 += v; if (v < min0) min0 = v; }
    const probs = min0 >= 0 && Math.abs(s0 - 1) < 0.05;
    let prev = -1, text = '', confSum = 0, confN = 0;
    for (let t = 0; t < steps; t++) {
      let best = 0, bestValue = -Infinity; const offset = t * vocab;
      for (let k = 0; k < vocab; k++) { const v = values[offset + k]; if (v > bestValue) { bestValue = v; best = k; } }
      if (best !== 0 && best !== prev && dictionary[best] !== undefined) {
        text += dictionary[best]; confSum += stepConf(values, offset, vocab, bestValue, probs); confN++;
      }
      prev = best;
    }
    return { text: text.trim(), conf: confN ? confSum / confN : 0 };
  }

  async function readBest(image, box, vertical, clear) {
    let r = await readLine(image, box, vertical);
    // A clearly oriented line is normally right; retry the other way only when nothing readable came out.
    if (!r.text || r.conf < (clear ? 0.2 : 0.55)) {
      const alt = await readLine(image, box, !vertical);
      if (alt.text && (alt.conf > r.conf + 0.1 || !r.text)) return { text: alt.text, conf: alt.conf, vertical: !vertical };
    }
    return { text: r.text, conf: r.conf, vertical };
  }

  async function run(url, id) {
    if (busy) { bridge('onOcrError', id, 'একটি OCR কাজ চলছে।'); return; }
    busy = true;
    const t0 = Date.now();
    try {
      await loadModels();
      const image = new Image(); image.decoding = 'async'; image.src = url;
      await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = () => reject(new Error('Local panel image could not load')); });
      const boxes = await detect(image);
      const dirs = GEOM.resolveOrientation(boxes);
      const lines = [];
      for (let i = 0; i < boxes.length; i++) {
        if (Date.now() - t0 > BUDGET_MS) break;
        const b = boxes[i], clear = GEOM.orient(b) !== 'u';
        let r;
        try { r = await readBest(image, b, dirs[i], clear); } catch (_) { continue; }
        if (!r.text) continue;
        if (r.conf < 0.15 && r.text.length <= 2) continue;       // lone low-confidence speck
        lines.push({ x: b.x, y: b.y, w: b.w, h: b.h, vertical: r.vertical, text: r.text, conf: r.conf, score: b.score });
      }
      const blocks = GEOM.groupLines(lines);
      const vertical = GEOM.sortBlocks(blocks);
      const regions = blocks.map((b, i) => Object.assign({
        order: i + 1, text: b.text, x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.w), h: Math.round(b.h),
        vertical: !!b.vertical, font: Math.round(b.font * 10) / 10, lines: b.lines, score: Math.round(b.conf * 1000) / 1000
      }, sampleColors(image, b)));
      bridge('onOcrResult', id, JSON.stringify({ width: image.naturalWidth, height: image.naturalHeight, verticalReading: vertical, regions }));
    } catch (e) { bridge('onOcrError', id, e && e.message ? e.message : String(e)); }
    finally { busy = false; }
  }

  window.runJapaneseMangaOcr = run;
  window.__NsMangaGeom = GEOM;
  loadModels().catch(e => {
    state.textContent = 'Runtime/model initialization failed: ' + (e && e.message ? e.message : String(e));
    try { if (window.NsJapaneseMangaBridge) window.NsJapaneseMangaBridge.onRuntimeError(state.textContent); } catch (_) {}
  });
})();
</script>
